name: BlueBuild
on:
  schedule:
    - cron: "0 17 * * *" # 17:00 UTC daily
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - ".github/ISSUE_TEMPLATE/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bluebuild:
    name: Build Custom Image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Image
        uses: blue-build/github-action@v1.13
        with:
          recipe: recipe.yml
          # Image signing: cosign.pub sits at the repo root, the private key is
          # the SIGNING_SECRET repo secret (setup: https://blue-build.org/how-to/cosign/)
          cosign_private_key: ${{ secrets.SIGNING_SECRET }}
          pr_event_number: ${{ github.event.number }}
          maximize_build_space: true
          use_cache: false
          squash: true
          skip_checkout: true
          registry: ghcr.io
          registry_namespace: ${{ github.repository_owner }}
