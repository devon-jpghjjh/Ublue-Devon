name: Build ISO
on:
  schedule:
    - cron: "30 18 * * *" # after the daily 17:00 UTC image build
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ISO
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Collect flatpak refs
        id: refs
        run: |
          REFS=$(grep -vE '^[[:space:]]*(#|$)' iso/flatpak-refs.txt | tr '\n' ' ' | xargs)
          echo "refs=$REFS" >> "$GITHUB_OUTPUT"

      - name: Build ISO
        uses: jasonn3/build-container-installer@v1.5.0
        id: build
        with:
          arch: x86_64
          image_name: devon-bazzite
          image_repo: ghcr.io/${{ github.repository_owner }}
          image_tag: latest
          image_signed: "false" # image is unsigned (signing not set up yet in bluebuild.yml)
          version: "44" # Fedora release the installer is built from — bump on F45 rebase
          variant: kinoite # KDE Plasma installer environment
          flatpak_remote_refs: ${{ steps.refs.outputs.refs }}
          # Creates the login user at install time (container installs have no
          # user-creation screen; same trick as Bazzite's official ISO).
          # Change the name/password in iso/set-default-user.tmpl, then change
          # the password again on first login (`passwd`).
          additional_templates: /github/workspace/iso/set-default-user.tmpl

      - name: Upload ISO to Job Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ISO
          if-no-files-found: error
          path: |
            ${{ steps.build.outputs.iso_path }}*
